<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chiarui & zsyuan's Wedding</title>
    <!-- 字體設定 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #d4a373;
            --secondary: #8da399;
            --bg-warm: #fefae0;
            --text-dark: #4a4e69;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #faf9f6;
            color: var(--text-dark);
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
        }

        .font-en { font-family: 'Cormorant Garamond', serif; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('./20260224-SHIN0233.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .timer-card {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 1rem 0.5rem;
            min-width: 65px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .timer-card {
                min-width: 85px;
                padding: 1.25rem 0.75rem;
            }
        }

        .timer-divider {
            width: 1px;
            height: 30px;
            background: #d1d1d1;
            margin: 0 4px;
        }

        .v-card {
            border-left: 3px solid var(--primary);
            padding-left: 1.5rem;
            margin-bottom: 3rem;
        }

        .no-wrap {
            white-space: nowrap;
            display: inline-block;
            max-width: 100%;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .accordion-active .accordion-content {
            max-height: 500px;
        }

        .accordion-icon {
            transition: transform 0.3s ease;
        }

        .accordion-active .accordion-icon {
            transform: rotate(180deg);
        }

        .music-disc {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid var(--primary);
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            transition: all 0.3s;
        }

        .countdown-title {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--secondary);
            margin-bottom: 1rem;
            font-weight: bold;
        }

        #yt-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            top: -10px;
            left: -10px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .rsvp-input {
            width: 100%;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.5rem 0;
            outline: none;
            font-size: 0.875rem;
            transition: border-color 0.3s;
            background: transparent;
        }
        .rsvp-input:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body id="wedding-body">

    <div id="yt-player-container">
        <div id="youtube-player"></div>
    </div>

    <div id="audio-ui" class="fixed bottom-6 right-6 z-[100]">
        <button id="mute-toggle" onclick="toggleMuteManual(event)" class="music-disc rounded-full shadow-2xl text-[#d4a373] focus:outline-none">
            <svg id="icon-volume-high" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14 8.83v6.34L11.83 13H9v-2h2.83L14 8.83M16 4l-5 5H7v6h4l5 5V4z"/>
            </svg>
            <svg id="icon-volume-muted" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
    </div>

    <nav class="glass-nav fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="font-en text-2xl font-medium tracking-widest text-[#d4a373]">C & Z</div>
        <div class="hidden lg:flex space-x-8 text-sm tracking-widest">
            <a href="#about" class="hover:text-[#d4a373]">關於我們 ABOUT</a>
            <a href="#details" class="hover:text-[#d4a373]">婚禮詳情 DETAILS</a>
            <a href="#rsvp" class="hover:text-[#d4a373]">出席回函 RSVP</a>
        </div>
        <div class="lg:hidden text-[10px] text-[#d4a373] font-bold">10.03 高雄場 / 11.14 台北場</div>
    </nav>

    <!-- 封面與內容省略，直接修復回函表單部分 -->
    <header class="hero-section">
        <div class="px-4 w-full">
            <div class="bg-black/20 p-6 md:p-10 rounded-lg backdrop-blur-[2px] inline-block max-w-[90%]">
                <h2 class="font-en italic text-xl md:text-2xl mb-4 tracking-[0.2em]">Love Love Love</h2>
                <h1 class="font-en text-5xl md:text-8xl mb-8">chiarui & zsyuan</h1>
            </div>
        </div>
    </header>

    <!-- 表單區塊 -->
    <section id="rsvp" class="py-20 px-4">
        <div class="max-w-2xl mx-auto bg-white p-6 md:p-12 shadow-sm rounded-2xl border border-gray-50">
            <h3 class="font-en text-3xl text-center mb-2 text-[#d4a373]">RSVP</h3>
            <p class="text-center text-xs text-gray-400 mb-10 tracking-widest italic">出席回函</p>
            
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(window.submitted) {showSuccess();}"></iframe>
            
            <!-- 確保 action 與 method 正確 -->
            <form action="https://docs.google.com/forms/d/e/1FAIpQLSeW46dOE1A9eaME1Wwi4Nh-NTaAMgwqBENh7qe14xtZh2UDAw/formResponse" method="POST" target="hidden_iframe" onsubmit="window.submitted=true;">
                <div class="space-y-8">
                    <!-- 基本資料 -->
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold mb-2">姓名 <span class="font-en text-[#8da399]">NAME</span></label>
                            <input type="text" name="entry.1188900738" class="rsvp-input" placeholder="請輸入您的姓名" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-2">與新人的關係 <span class="font-en text-[#8da399]">RELATIONSHIP</span></label>
                            <!-- Value 必須與表單完全一致 -->
                            <select name="entry.924886869" class="rsvp-input" required>
                                <option value="" hidden disabled selected>請選擇您的身分</option>
                                <option value="新郎同事、同學、朋友">新郎同事、同學、朋友</option>
                                <option value="新娘同事、同學、朋友">新娘同事、同學、朋友</option>
                                <option value="雙方共同朋友">雙方共同朋友</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold mb-2">出席意願 <span class="font-en text-[#8da399]">ATTENDANCE</span></label>
                            <!-- Value 修正為 "出席" 或 "不克出席"，移除括號說明以匹配表單設定 -->
                            <select name="entry.1140731537" id="attendance" class="rsvp-input" required onchange="toggleGuestOptions()">
                                <option value="" hidden disabled selected>請選擇</option>
                                <option value="出席">出席</option>
                                <option value="不克出席，禮到人不到">不克出席，禮到人不到</option>
                                <option value="無法到場，心意到">無法到場，心意到</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-2">參加場次 <span class="font-en text-[#8da399]">SELECTION</span></label>
                            <!-- entry.576496126 -->
                            <select name="entry.576496126" id="wedding_selection" class="rsvp-input" onchange="updateWeddingFields()">
                                <option value="" hidden disabled selected>請選擇場次</option>
                                <option value="高雄場 (10/03)">高雄場 (10/03)</option>
                                <option value="台北場 (11/14)">台北場 (11/14)</option>
                                <option value="兩場皆參加">兩場皆參加</option>
                            </select>
                        </div>
                    </div>

                    <!-- 人數統計區 (由 JS 動態更新內容與 entry ID) -->
                    <div id="guest_stats_container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- 動態生成內容見 JavaScript -->
                    </div>

                    <!-- 喜帖領取區 -->
                    <div>
                        <label class="block text-xs font-bold mb-4">喜帖領取方式 <span class="font-en text-[#8da399]">INVITATION</span></label>
                        <!-- entry.625677536 -->
                        <div class="flex gap-6">
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="radio" name="entry.625677536" value="電子喜帖" class="mr-2 accent-[#d4a373]" onclick="updateInvitationFields('電子')"> 電子喜帖
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="radio" name="entry.625677536" value="紙本喜帖" class="mr-2 accent-[#d4a373]" onclick="updateInvitationFields('紙本')"> 紙本喜帖
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="radio" name="entry.625677536" value="都要" class="mr-2 accent-[#d4a373]" onclick="updateInvitationFields('都要')"> 都要
                            </label>
                        </div>
                    </div>

                    <!-- 動態詳細資料區 (Email, 地址, 電話) -->
                    <div id="invitation_detail_container" class="space-y-6"></div>

                    <!-- 祝福話語 -->
                    <div>
                        <label class="block text-xs font-bold mb-2">想對新人說的話 <span class="font-en text-[#8da399]">MESSAGE</span></label>
                        <textarea name="entry.1604477425" class="rsvp-input" rows="3" placeholder="留下您的祝福..."></textarea>
                    </div>

                    <div class="pt-6">
                        <button type="submit" class="w-full py-4 btn-primary rounded-xl font-bold tracking-widest text-sm shadow-lg">確認送出 SUBMIT</button>
                    </div>
                </div>
            </form>

            <div id="success_msg" class="hidden text-center py-12">
                <div class="text-4xl mb-4">✨</div>
                <h4 class="text-xl font-bold text-[#d4a373] mb-2">回函已成功送出</h4>
                <p class="text-gray-500 text-sm">期待在婚禮上見到您！</p>
                <button onclick="location.reload()" class="mt-8 text-xs text-[#8da399] underline">重新填寫</button>
            </div>
        </div>
    </section>

    <script>
        // 倒數計時與手風琴邏輯保持不變 (略)
        function toggleAccordion(element) {
            element.classList.toggle('accordion-active');
        }

        function updateWeddingFields() {
            const selection = document.getElementById('wedding_selection').value;
            const container = document.getElementById('guest_stats_container');
            
            let html = '';
            
            // 根據場次顯示正確的 entry ID
            if (selection.includes('高雄場')) {
                html = `
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄成人</label>
                        <input type="number" name="entry.1258816680" class="rsvp-input" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄兒童</label>
                        <input type="number" name="entry.295167265" class="rsvp-input" value="0" min="0">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄素食</label>
                        <input type="number" name="entry.2087293067" class="rsvp-input" value="0" min="0">
                    </div>
                `;
            } else if (selection.includes('台北場')) {
                html = `
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北人數</label>
                        <input type="number" name="entry.356161891" class="rsvp-input" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北兒童</label>
                        <input type="number" name="entry.1582622195" class="rsvp-input" value="0" min="0">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北素食</label>
                        <input type="number" name="entry.408306258" class="rsvp-input" value="0" min="0">
                    </div>
                `;
            } else if (selection.includes('兩場皆參加')) {
                html = `
                    <div class="col-span-full border-b pb-1 mb-1 text-[10px] text-[#d4a373]">高雄場人數統計</div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄成人</label>
                        <input type="number" name="entry.1258816680" class="rsvp-input" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄兒童</label>
                        <input type="number" name="entry.295167265" class="rsvp-input" value="0" min="0">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">高雄素食</label>
                        <input type="number" name="entry.2087293067" class="rsvp-input" value="0" min="0">
                    </div>
                    <div class="col-span-full border-b pb-1 mt-2 mb-1 text-[10px] text-[#d4a373]">台北場人數統計</div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北人數</label>
                        <input type="number" name="entry.356161891" class="rsvp-input" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北兒童</label>
                        <input type="number" name="entry.1582622195" class="rsvp-input" value="0" min="0">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">台北素食</label>
                        <input type="number" name="entry.408306258" class="rsvp-input" value="0" min="0">
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function updateInvitationFields(type) {
            const container = document.getElementById('invitation_detail_container');
            const emailField = `
                <div>
                    <label class="block text-xs font-bold mb-2">Email (接收電子喜帖)</label>
                    <input type="email" name="entry.1679138199" class="rsvp-input" placeholder="example@mail.com" required>
                </div>
            `;
            const paperFields = `
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold mb-2">收件地址 (郵遞區號+地址)</label>
                        <input type="text" name="entry.1834394045" class="rsvp-input" placeholder="請輸入收件地址" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-2">連絡電話</label>
                        <input type="tel" name="entry.1826199566" class="rsvp-input" placeholder="請輸入電話" required>
                    </div>
                </div>
            `;

            if (type === '電子') {
                container.innerHTML = emailField;
            } else if (type === '紙本') {
                container.innerHTML = paperFields;
            } else if (type === '都要') {
                container.innerHTML = emailField + paperFields;
            }
        }

        function toggleGuestOptions() {
            const attendance = document.getElementById('attendance').value;
            const selectionSelect = document.getElementById('wedding_selection');
            const isAttending = (attendance === '出席');

            selectionSelect.disabled = !isAttending;
            selectionSelect.style.opacity = isAttending ? '1' : '0.5';
            selectionSelect.required = isAttending;

            if (!isAttending) {
                document.getElementById('guest_stats_container').innerHTML = '';
            } else {
                updateWeddingFields();
            }
        }

        function showSuccess() {
            document.getElementById('success_msg').classList.remove('hidden');
            document.querySelector('form').classList.add('hidden');
            window.scrollTo({ top: document.getElementById('rsvp').offsetTop - 100, behavior: 'smooth' });
        }

        // 初始化
        window.onload = function() {
            updateWeddingFields();
        };
    </script>
</body>
</html>
